---
name: 'Verify CI_BOT_TOKEN'
description: >-
  Preflight check for the CI_BOT_TOKEN PAT: fail loudly on an invalid or
  expired token (HTTP 401) and report via `use_pat` whether the token can reach
  the code-scanning API, so SARIF uploads fall back to github.token otherwise.

# This action is the CANONICAL copy of the "Verify CI_BOT_TOKEN is valid"
# preflight (#355, #482). The six inline copies in reusable-ci.yml and
# reusable-security.yml (sast-semgrep, sast-codeql, scorecard-token-preflight)
# are switched to it in a follow-up, once a release tag contains this action:
# a reusable workflow cannot use the `./` form (it resolves against the CALLER's
# checkout, #262), so it needs the remote form pinned to a tag. Until then the
# drift guard test_verify_ci_bot_token_action.py keeps every inline copy
# byte-identical to the script below.
#
# A composite action cannot read the `secrets` context, so the caller passes the
# token as the `token` input: `token: ${{ secrets.CI_BOT_TOKEN }}`.

inputs:
  token:
    description: >-
      The CI_BOT_TOKEN secret (pass `secrets.CI_BOT_TOKEN`; a composite action
      cannot read the secrets context). When empty the check is a no-op and
      `use_pat` is `false`.
    required: false
    default: ''

outputs:
  use_pat:
    description: >-
      'true' when CI_BOT_TOKEN is set and usable for SARIF upload, 'false' when
      it is unset or cannot reach the code-scanning API (use github.token).
    value: ${{ steps.token-preflight.outputs.use_pat }}

runs:
  using: composite
  steps:
    - id: token-preflight
      shell: bash
      env:
        CI_BOT_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "${CI_BOT_TOKEN}" ]; then
          echo "CI_BOT_TOKEN not set; using the github.token fallback."
          echo "use_pat=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! command -v curl >/dev/null 2>&1; then
          echo "::warning title=CI_BOT_TOKEN not checked::curl is unavailable here; skipping the check."
          echo "use_pat=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
          https://api.github.com/rate_limit) || status="000"
        case "${status}" in
          200) echo "CI_BOT_TOKEN is valid." ;;
          401)
            msg="CI_BOT_TOKEN is invalid or expired (HTTP 401)."
            msg="${msg} Rotate it, or delete the secret to fall back to github.token."
            echo "::error title=CI_BOT_TOKEN invalid::${msg}"
            exit 1
            ;;
          *) echo "::warning title=CI_BOT_TOKEN unchecked::/rate_limit returned HTTP ${status}; not failing." ;;
        esac
        # #482: a PAT can pass /rate_limit yet lack code-scanning access (404).
        # Read access is the best non-mutating signal (no write probe exists),
        # and a 403 may be a rate limit; github.token is the safe fallback.
        cs_status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?per_page=1") || cs_status="000"
        case "${cs_status}" in
          200) echo "use_pat=true" >> "$GITHUB_OUTPUT" ;;
          401)
            msg="CI_BOT_TOKEN was rejected by the code-scanning API (HTTP 401)."
            msg="${msg} Rotate it, or delete the secret to fall back to github.token."
            echo "::error title=CI_BOT_TOKEN invalid::${msg}"
            exit 1
            ;;
          403|404)
            msg="CI_BOT_TOKEN can't reach the code-scanning API (HTTP ${cs_status})."
            msg="${msg} SARIF upload will fall back to github.token."
            echo "::warning title=CI_BOT_TOKEN lacks code-scanning access::${msg}"
            echo "use_pat=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::warning title=CI_BOT_TOKEN unchecked::Could not verify code-scanning access (HTTP ${cs_status}); keeping CI_BOT_TOKEN."
            echo "use_pat=true" >> "$GITHUB_OUTPUT"
            ;;
        esac
