---
# ============================================================================
# AUTO-MERGE RELEASE-PLEASE PRs
# ============================================================================
# Automatically merges release-please PRs after CI passes.
# Release-please PRs are machine-generated version bumps (changelog,
# version numbers) that don't require manual review.
#
# Trigger: pull_request on main from release-please branches
# ============================================================================
name: Auto-Merge Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Top level grants no write (OpenSSF Token-Permissions, #359); writes are job-scoped.
permissions:
  contents: read

jobs:
  auto-merge-release:
    name: "🤖 Auto-Merge Release PR"
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-please--branches--')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Trigger is pull_request: check out the BASE commit, never the PR head,
      # so the local action below is trusted code (not PR-controlled) when it
      # receives CI_BOT_TOKEN.
      - name: Checkout verify-ci-bot-token action (base ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || secrets.GITHUB_TOKEN` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        uses: ./.github/actions/verify-ci-bot-token
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          check-code-scanning: 'false'

      - name: Enable auto-merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto --squash --delete-branch \
            --repo "${{ github.repository }}"
        env:
          # CI_BOT_TOKEN (PAT) required so the merge push triggers
          # downstream on:push workflows (e.g. release-please).
          # GITHUB_TOKEN pushes are silently ignored by Actions.
          GH_TOKEN: ${{ secrets.CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
