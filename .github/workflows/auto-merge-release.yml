---
# ============================================================================
# AUTO-MERGE RELEASE-PLEASE PRs
# ============================================================================
# Automatically merges release-please PRs after CI passes.
# Release-please PRs are machine-generated version bumps (changelog,
# version numbers) that don't require manual review.
#
# Trigger: pull_request on main from release-please branches
# ============================================================================
name: Auto-Merge Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-release:
    name: "🤖 Auto-Merge Release PR"
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release-please--branches--')
    steps:
      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || secrets.GITHUB_TOKEN` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          if [ -z "${CI_BOT_TOKEN}" ]; then
            echo "CI_BOT_TOKEN not set; using the github.token fallback."
            exit 0
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "::warning title=CI_BOT_TOKEN not checked::curl is unavailable here; skipping the check."
            exit 0
          fi
          status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            https://api.github.com/rate_limit) || status="000"
          case "${status}" in
            200) echo "CI_BOT_TOKEN is valid." ;;
            401)
              msg="CI_BOT_TOKEN is invalid or expired (HTTP 401)."
              msg="${msg} Rotate it, or delete the secret to fall back to github.token."
              echo "::error title=CI_BOT_TOKEN invalid::${msg}"
              exit 1
              ;;
            *) echo "::warning title=CI_BOT_TOKEN unchecked::/rate_limit returned HTTP ${status}; not failing." ;;
          esac

      - name: Enable auto-merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto --squash --delete-branch \
            --repo "${{ github.repository }}"
        env:
          # CI_BOT_TOKEN (PAT) required so the merge push triggers
          # downstream on:push workflows (e.g. release-please).
          # GITHUB_TOKEN pushes are silently ignored by Actions.
          GH_TOKEN: ${{ secrets.CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
