---
# Auto-approve and auto-merge dependabot PRs for patch and minor updates.
# Major version bumps still require manual review.
# Thin caller of the reusable workflow shipped to downstream repos, so this
# repo exercises the same code path (defaults: approve, squash, no majors).
name: Dependabot Auto-Merge

on: pull_request

# Top level grants no write (OpenSSF Token-Permissions, #359); writes are job-scoped.
permissions:
  contents: read

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-dependabot-auto-merge.yml
