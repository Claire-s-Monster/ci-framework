---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No checkout and no GPG setup, on purpose. release-please-action works
      # entirely over the GitHub API: it reads files from the branch and creates
      # the release branch, tree, commit and PR server-side, so it never touches
      # a local working tree or the local git/GPG config. Release commits on main
      # are signed by GitHub's web-flow key when the release PR is merged.
      # Importing the bot's GPG key here only exposed the private key on a
      # runner holding contents: write and CI_BOT_TOKEN, for no effect.
      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || secrets.GITHUB_TOKEN` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          if [ -z "${CI_BOT_TOKEN}" ]; then
            echo "CI_BOT_TOKEN not set; using the github.token fallback."
            exit 0
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "::warning title=CI_BOT_TOKEN not checked::curl is unavailable here; skipping the check."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            https://api.github.com/rate_limit) || status="000"
          case "${status}" in
            200) echo "CI_BOT_TOKEN is valid." ;;
            401)
              msg="CI_BOT_TOKEN is invalid or expired (HTTP 401)."
              msg="${msg} Rotate it, or delete the secret to fall back to github.token."
              echo "::error title=CI_BOT_TOKEN invalid::${msg}"
              exit 1
              ;;
            *) echo "::warning title=CI_BOT_TOKEN unchecked::/rate_limit returned HTTP ${status}; not failing." ;;
          esac

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # CI_BOT_TOKEN (PAT) so the PR is authored by CIFrameworkBot (a repo
          # collaborator), not github-actions[bot] (outside collaborator).
          # Avoids "workflows awaiting approval" on public repos and ensures
          # the merge push triggers downstream on:push workflows.
          # Falls back to GITHUB_TOKEN if CI_BOT_TOKEN is not configured.
          token: ${{ secrets.CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: python
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Create GitHub Pages deployment if release was created
  deploy-pages:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Documentation
        run: |
          mkdir -p _site
          {
            echo "# CI Framework v${{ needs.release-please.outputs.tag_name }}"
            echo "## Release Notes"
            echo "This release includes:"
            echo "- Self-Healing CI Infrastructure"
            echo "- Automated CHANGELOG generation"
            echo "- Enhanced documentation"
          } > _site/index.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
