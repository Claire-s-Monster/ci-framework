---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # gpg-signing-setup is a local composite action, so the repository must be
      # checked out before it can be resolved. release-please-action itself works
      # over the API, which is why this workflow had no checkout step before.
      - uses: actions/checkout@v7

      - name: Import GPG key and configure Git
        uses: ./.github/actions/gpg-signing-setup
        with:
          gpg-private-key: ${{ secrets.CI_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.CI_BOT_GPG_KEY_ID }}
          git-user-name: CIFrameworkBot
          git-user-email: 223036950+CIFrameworkBot@users.noreply.github.com

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # CI_BOT_TOKEN (PAT) so the PR is authored by CIFrameworkBot (a repo
          # collaborator), not github-actions[bot] (outside collaborator).
          # Avoids "workflows awaiting approval" on public repos and ensures
          # the merge push triggers downstream on:push workflows.
          # Falls back to GITHUB_TOKEN if CI_BOT_TOKEN is not configured.
          token: ${{ secrets.CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: python
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Create GitHub Pages deployment if release was created
  deploy-pages:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Documentation
        run: |
          mkdir -p _site
          {
            echo "# CI Framework v${{ needs.release-please.outputs.tag_name }}"
            echo "## Release Notes"
            echo "This release includes:"
            echo "- Self-Healing CI Infrastructure"
            echo "- Automated CHANGELOG generation"
            echo "- Enhanced documentation"
          } > _site/index.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
