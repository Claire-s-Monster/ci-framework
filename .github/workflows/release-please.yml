---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

# Never cancel a running release-please (it may be creating a tag/release); a newer
# push replaces a queued run, which then processes the latest main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No GPG setup and no working-tree checkout for release-please itself, on
      # purpose. release-please-action works entirely over the GitHub API: it
      # reads files from the branch and creates the release branch, tree, commit
      # and PR server-side, so it never touches a local working tree or the
      # local git/GPG config. Release commits on main are signed by GitHub's
      # web-flow key when the release PR is merged. Importing the bot's GPG key
      # here only exposed the private key on a runner holding contents: write
      # and CI_BOT_TOKEN, for no effect.
      # The only checkout is the sparse `.github/actions` one below, with
      # persist-credentials: false, so the local preflight action resolves.
      - name: Checkout verify-ci-bot-token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || secrets.GITHUB_TOKEN` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        id: token-preflight
        uses: ./.github/actions/verify-ci-bot-token
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          check-code-scanning: 'false'

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        with:
          # CI_BOT_TOKEN (PAT) so the PR is authored by CIFrameworkBot (a repo
          # collaborator), not github-actions[bot] (outside collaborator).
          # Avoids "workflows awaiting approval" on public repos and ensures
          # the merge push triggers downstream on:push workflows.
          # Falls back to github.token when CI_BOT_TOKEN is not configured or
          # the preflight did not accept it (#509).
          token: ${{ steps.token-preflight.outputs.use_pat == 'true' && secrets.CI_BOT_TOKEN || github.token }}
          # No release-type input: setting it makes the action ignore
          # config-file, which silently dropped extra-files (the
          # x-release-please-version refs) and changelog-sections (#390).
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Relabel fixed-in-development issues as released when this tag contains
  # their fix (#394). Called in-line: a release created by a token does not
  # reliably trigger `release: published` workflows.
  release-tracking:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/reusable-release-tracking.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Create GitHub Pages deployment if release was created.
  # Upload and deploy are separate jobs on purpose (#487): in one job,
  # actions/deploy-pages#451 races the artifact finalisation (ListArtifacts
  # returns 0 shortly after upload). Do NOT "re-run" a failed deploy: that
  # duplicates the github-pages artifact ("Multiple artifacts"). Retry with a
  # workflow_dispatch of deploy-pages.yml instead, passing the release tag as
  # its `version` input: the default 'latest' resolves via `git describe` on a
  # shallow checkout without tags and publishes "dev".
  build-pages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages (no enablement) only does GET /repos/{owner}/{repo}/pages;
      # upload-pages-artifact is tar + upload-artifact. Only deploy-pages needs write.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

      - name: Build Documentation
        run: |
          mkdir -p _site
          {
            echo "# CI Framework v${{ needs.release-please.outputs.tag_name }}"
            echo "## Release Notes"
            echo "This release includes:"
            echo "- Self-Healing CI Infrastructure"
            echo "- Automated CHANGELOG generation"
            echo "- Enhanced documentation"
          } > _site/index.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: '_site'

  deploy-pages:
    needs: [release-please, build-pages]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Same group as deploy-pages.yml so a release deploy and a manual dispatch
    # serialise instead of an older deploy overwriting a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
