---
name: Reusable Gemini AI Analysis

# Reusable AI-powered code analysis using Gemini SDK via pixi
# Can be called from any repository with:
#   uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-gemini-ai.yml@main

on:
  workflow_call:
    inputs:
      enable-pr-review:
        description: 'Enable AI PR code review'
        required: false
        type: boolean
        default: true
      enable-ci-analysis:
        description: 'Enable CI impact analysis on PRs'
        required: false
        type: boolean
        default: true
      enable-issue-triage:
        description: 'Enable AI issue triage and labeling'
        required: false
        type: boolean
        default: true
      enable-comprehensive:
        description: 'Enable comprehensive analysis (workflow_dispatch only)'
        required: false
        type: boolean
        default: true
      gemini-model:
        description: 'Gemini model to use'
        required: false
        type: string
        default: 'gemini-2.0-flash'
      pixi-version:
        description: 'Pixi version to use'
        required: false
        type: string
        default: 'v0.82.0'
    secrets:
      GEMINI_API_KEY:
        description: 'Google Gemini API key'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  pr-review:
    # GitHub withholds repository secrets from pull_request-triggered runs
    # authored by dependabot[bot] (same protection class as fork-PR secrets),
    # so GEMINI_API_KEY is unavailable here regardless of repo config. Skip
    # cleanly instead of failing. Use the PR author, not github.actor, since
    # github.actor reflects whoever triggers this run (e.g. a manual rerun)
    # and would otherwise defeat this check.
    if: inputs.enable-pr-review && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false

      - name: Create genai environment
        run: |
          mkdir -p /tmp/genai-env
          cat > /tmp/genai-env/pixi.toml << 'TOML'
          [project]
          name = "genai-runner"
          channels = ["conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          python = ">=3.11"

          [pypi-dependencies]
          google-genai = "*"
          TOML
          cd /tmp/genai-env && pixi install

      - name: Get PR diff
        id: diff
        run: |
          echo "files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | head -20 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr_diff.txt

      - name: Run Gemini PR Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
        run: |
          head -c 10000 /tmp/pr_diff.txt > /tmp/pr_diff_truncated.txt

          cat > /tmp/genai-env/review.py << 'PYTHON'
          import os
          import sys
          from google import genai
          from google.genai import errors


          def skip_if_quota(exc):
              # Quota or billing refusals cannot be fixed by the PR author,
              # so warn and exit 0. Anything else propagates and fails the job.
              code = getattr(exc, 'code', None)
              status = getattr(exc, 'status', None)
              if code not in (402, 429) and status != 'RESOURCE_EXHAUSTED':
                  raise exc
              print(f"::warning title=Gemini unavailable::Gemini API returned {code} {status} (quota or billing). AI analysis skipped; this does not reflect on the PR.")
              note = f"Gemini AI analysis skipped: API returned {code} {status} (quota or billing).\n"
              for var, text in (('GITHUB_STEP_SUMMARY', note), ('GITHUB_OUTPUT', 'skipped=true\n')):
                  with open(os.environ[var], 'a') as f:
                      f.write(text)
              sys.exit(0)


          client = genai.Client()

          with open('/tmp/pr_diff_truncated.txt', 'r') as f:
              diff = f.read()

          prompt = f"""You are an expert code reviewer.

          **Changed Files**: {os.environ.get('CHANGED_FILES', 'N/A')}

          Review the PR and provide:
          1. **Summary** (2-3 sentences)
          2. **Code Quality** (1-10, key observations)
          3. **Security** (any concerns?)
          4. **Suggestions** (top 3)

          Be concise.

          **Diff:**
          ```
          {diff}
          ```"""

          try:
              response = client.models.generate_content(
                  model=os.environ.get('GEMINI_MODEL', 'gemini-2.0-flash'),
                  contents=prompt
              )
          except errors.APIError as exc:
              skip_if_quota(exc)

          with open('/tmp/ai_review.md', 'w') as f:
              f.write(response.text)
          print(response.text)
          PYTHON

          cd /tmp/genai-env && pixi run python review.py

      - name: Comment on PR
        if: steps.review.outputs.skipped != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let aiReview = "AI review completed. Check job logs for details.";
            try {
              aiReview = fs.readFileSync('/tmp/ai_review.md', 'utf8');
            } catch (e) {
              console.log('Could not read review:', e.message);
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Gemini AI Code Review\n\n${aiReview}\n\n---\n*Generated by [CI Framework](https://github.com/Claire-s-Monster/ci-framework) Gemini AI*`
            });

  ci-analysis:
    # See pr-review job: dependabot[bot]-authored pull_request runs have no
    # access to repository secrets, so GEMINI_API_KEY is unavailable here.
    # Checked via the PR author since github.actor breaks on manual reruns.
    if: inputs.enable-ci-analysis && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false

      - name: Create genai environment
        run: |
          mkdir -p /tmp/genai-env
          cat > /tmp/genai-env/pixi.toml << 'TOML'
          [project]
          name = "genai-runner"
          channels = ["conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          python = ">=3.11"

          [pypi-dependencies]
          google-genai = "*"
          TOML
          cd /tmp/genai-env && pixi install

      - name: Analyze CI Impact
        id: ci_check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt

          cat > /tmp/genai-env/ci_check.py << 'PYTHON'
          import os
          import sys
          from google import genai
          from google.genai import errors


          def skip_if_quota(exc):
              # Quota or billing refusals cannot be fixed by the PR author,
              # so warn and exit 0. Anything else propagates and fails the job.
              code = getattr(exc, 'code', None)
              status = getattr(exc, 'status', None)
              if code not in (402, 429) and status != 'RESOURCE_EXHAUSTED':
                  raise exc
              print(f"::warning title=Gemini unavailable::Gemini API returned {code} {status} (quota or billing). AI analysis skipped; this does not reflect on the PR.")
              note = f"Gemini AI analysis skipped: API returned {code} {status} (quota or billing).\n"
              for var, text in (('GITHUB_STEP_SUMMARY', note), ('GITHUB_OUTPUT', 'skipped=true\n')):
                  with open(os.environ[var], 'a') as f:
                      f.write(text)
              sys.exit(0)


          client = genai.Client()

          with open('/tmp/changed.txt', 'r') as f:
              files = f.read()

          prompt = f"""CI/CD expert: analyze these changed files for CI impact.
          Files: {files}

          Respond with:
          - Impact Level: Low/Medium/High
          - Workflow Changes: yes/no
          - Concerns: (if any)
          - Recommendation: (one line)

          Max 100 words."""

          try:
              response = client.models.generate_content(
                  model=os.environ.get('GEMINI_MODEL', 'gemini-2.0-flash'),
                  contents=prompt
              )
          except errors.APIError as exc:
              skip_if_quota(exc)

          with open('/tmp/ci_impact.md', 'w') as f:
              f.write(response.text)
          print(response.text)
          PYTHON

          cd /tmp/genai-env && pixi run python ci_check.py

      - name: Post Summary
        if: steps.ci_check.outputs.skipped != 'true'
        run: |
          {
            echo "## 🔍 CI Impact Analysis"
            echo "**PR**: #${{ github.event.pull_request.number }}"
            echo ""
            cat /tmp/ci_impact.md
          } >> "$GITHUB_STEP_SUMMARY"

  issue-triage:
    if: inputs.enable-issue-triage && github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false

      - name: Create genai environment
        run: |
          mkdir -p /tmp/genai-env
          cat > /tmp/genai-env/pixi.toml << 'TOML'
          [project]
          name = "genai-runner"
          channels = ["conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          python = ">=3.11"

          [pypi-dependencies]
          google-genai = "*"
          TOML
          cd /tmp/genai-env && pixi install

      - name: Run Issue Triage
        id: triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > /tmp/genai-env/triage.py << 'PYTHON'
          import os
          import sys
          from google import genai
          from google.genai import errors


          def skip_if_quota(exc):
              # Quota or billing refusals cannot be fixed by the PR author,
              # so warn and exit 0. Anything else propagates and fails the job.
              code = getattr(exc, 'code', None)
              status = getattr(exc, 'status', None)
              if code not in (402, 429) and status != 'RESOURCE_EXHAUSTED':
                  raise exc
              print(f"::warning title=Gemini unavailable::Gemini API returned {code} {status} (quota or billing). AI analysis skipped; this does not reflect on the PR.")
              note = f"Gemini AI analysis skipped: API returned {code} {status} (quota or billing).\n"
              for var, text in (('GITHUB_STEP_SUMMARY', note), ('GITHUB_OUTPUT', 'skipped=true\n')):
                  with open(os.environ[var], 'a') as f:
                      f.write(text)
              sys.exit(0)


          client = genai.Client()

          title = os.environ.get('ISSUE_TITLE', 'N/A')
          body = os.environ.get('ISSUE_BODY', 'N/A')[:2000]

          prompt = f"""Classify this GitHub issue:
          Title: {title}
          Body: {body}

          Respond with ONLY JSON:
          {{"type": "bug|feature|question", "labels": ["label1"], "summary": "one sentence"}}

          Labels: bug, enhancement, documentation, question, help wanted, good first issue"""

          try:
              response = client.models.generate_content(
                  model=os.environ.get('GEMINI_MODEL', 'gemini-2.0-flash'),
                  contents=prompt
              )
          except errors.APIError as exc:
              skip_if_quota(exc)

          with open('/tmp/triage.json', 'w') as f:
              f.write(response.text)
          print(response.text)
          PYTHON

          cd /tmp/genai-env && pixi run python triage.py

      - name: Apply Labels and Comment
        if: steps.triage.outputs.skipped != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let labels = ['question'];
            let summary = 'Issue under review.';

            try {
              const raw = fs.readFileSync('/tmp/triage.json', 'utf8');
              const match = raw.match(/```json?\s*([\s\S]*?)\s*```/) || [null, raw];
              const result = JSON.parse(match[1] || raw);
              labels = result.labels || [result.type || 'question'];
              summary = result.summary || summary;
            } catch (e) {
              console.log('Parse error:', e.message);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels.slice(0, 3)
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Triage\n\n**Summary**: ${summary}\n**Labels**: ${labels.join(', ')}\n\n---\n*Automated by [CI Framework](https://github.com/Claire-s-Monster/ci-framework)*`
            });

  comprehensive-analysis:
    if: inputs.enable-comprehensive && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false

      - name: Create genai environment
        run: |
          mkdir -p /tmp/genai-env
          cat > /tmp/genai-env/pixi.toml << 'TOML'
          [project]
          name = "genai-runner"
          channels = ["conda-forge"]
          platforms = ["linux-64"]

          [dependencies]
          python = ">=3.11"

          [pypi-dependencies]
          google-genai = "*"
          TOML
          cd /tmp/genai-env && pixi install

      - name: Run Analysis
        id: analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
        run: |
          find . -name "*.py" -o -name "*.yml" | head -30 > /tmp/files.txt

          cat > /tmp/genai-env/analyze.py << 'PYTHON'
          import os
          import sys
          from google import genai
          from google.genai import errors


          def skip_if_quota(exc):
              # Quota or billing refusals cannot be fixed by the PR author,
              # so warn and exit 0. Anything else propagates and fails the job.
              code = getattr(exc, 'code', None)
              status = getattr(exc, 'status', None)
              if code not in (402, 429) and status != 'RESOURCE_EXHAUSTED':
                  raise exc
              print(f"::warning title=Gemini unavailable::Gemini API returned {code} {status} (quota or billing). AI analysis skipped; this does not reflect on the PR.")
              note = f"Gemini AI analysis skipped: API returned {code} {status} (quota or billing).\n"
              for var, text in (('GITHUB_STEP_SUMMARY', note), ('GITHUB_OUTPUT', 'skipped=true\n')):
                  with open(os.environ[var], 'a') as f:
                      f.write(text)
              sys.exit(0)


          client = genai.Client()

          with open('/tmp/files.txt', 'r') as f:
              files = f.read()

          prompt = f"""Analyze this project.
          Files: {files}

          Provide: Key Findings (3-5 points), Recommendations, Risk Areas. Max 400 words."""

          try:
              response = client.models.generate_content(
                  model=os.environ.get('GEMINI_MODEL', 'gemini-2.0-flash'),
                  contents=prompt
              )
          except errors.APIError as exc:
              skip_if_quota(exc)

          with open('/tmp/analysis.md', 'w') as f:
              f.write(response.text)
          print(response.text)
          PYTHON

          cd /tmp/genai-env && pixi run python analyze.py

      - name: Post Summary
        if: steps.analysis.outputs.skipped != 'true'
        run: |
          {
            echo "## 🔍 AI Analysis"
            echo ""
            cat /tmp/analysis.md
          } >> "$GITHUB_STEP_SUMMARY"
