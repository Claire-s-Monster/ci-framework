---
# ============================================================================
# REUSABLE SECURITY SCANNING - Multi-Language Dependency & Code Security
# ============================================================================
# Auto-detects languages and runs appropriate security scans:
# - Dependency audits (pixi safety-check, cargo-audit, cargo-deny, npm audit)
# - SAST (Semgrep, CodeQL)
# - Secret scanning (TruffleHog)
# - Security posture (OpenSSF Scorecard)
#
# USAGE:
#    ```yaml
#    jobs:
#      security:
#        uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@main
#        permissions:
#          contents: read
#          actions: read
#          id-token: write
#          # security-events: write — NOT NEEDED when CI_BOT_TOKEN is
#          # provided via secrets: inherit.  Omit for clean Scorecard
#          # Token-Permissions score.
#        secrets: inherit           # passes CI_BOT_TOKEN for SARIF uploads
#    ```
#
# See docs/security-scanning.md for full documentation.
# ============================================================================
name: Reusable Security Scanning

on:
  workflow_call:
    inputs:
      pixi-version:
        description: >-
          Pixi CLI version passed to prefix-dev/setup-pixi. Note this is the
          pixi BINARY version, not the setup-pixi action tag. It must be new
          enough to read the consumer's pixi.lock schema: pixi >= v0.68.0 is
          required for lock schema v7. Override this when your lockfile is
          regenerated by a newer pixi than the framework default (issue #250).
        required: false
        type: string
        default: 'v0.74.0'
      languages:
        description: "Comma-separated languages to check (auto-detect if empty)"
        required: false
        type: string
        default: ''
      codeql-languages:
        description: >-
          Comma-separated CodeQL language allowlist (e.g. "python"). When set,
          overrides autodetection for the CodeQL matrix ONLY — unlike
          `languages`, which restricts every security scan. Lets a caller keep
          autodetect for dependency/secret scans while pinning CodeQL to
          specific languages (issue #227). Valid values: python, c-cpp,
          javascript-typescript. Empty (default) = autodetect from sources.
        required: false
        type: string
        default: ''
      fail-on-cve:
        description: "Fail on known dependency CVEs"
        required: false
        type: boolean
        default: true
      fail-on-sast:
        description: "Fail on SAST findings"
        required: false
        type: boolean
        default: false
      fail-on-secrets:
        description: "Fail on detected secrets"
        required: false
        type: boolean
        default: true
      scorecard:
        description: "Run OpenSSF Scorecard"
        required: false
        type: boolean
        default: true
    secrets:
      CI_BOT_TOKEN:
        description: >-
          PAT with security_events scope for SARIF uploads.  When
          provided, callers do NOT need security-events: write on
          GITHUB_TOKEN, keeping Scorecard Token-Permissions clean.
          Falls back to github.token.
        required: false

# NOTE: No top-level permissions block. For workflow_call the CALLER
# controls GITHUB_TOKEN permissions.  Each job below declares its own
# least-privilege set.  SARIF uploads use CI_BOT_TOKEN (PAT) so
# callers never need security-events: write on GITHUB_TOKEN.

jobs:
  detect-languages:
    name: "🔍 Detect Languages"
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      rust: ${{ steps.detect.outputs.rust }}
      c_cpp: ${{ steps.detect.outputs.c_cpp }}
      cython: ${{ steps.detect.outputs.cython }}
      js_ts: ${{ steps.detect.outputs.js_ts }}
      codeql_matrix: ${{ steps.codeql-matrix.outputs.matrix }}
      has_codeql: ${{ steps.codeql-matrix.outputs.has_codeql }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        env:
          LANGUAGES_INPUT: ${{ inputs.languages }}
        run: |
          # Override detection if languages input is provided
          if [ -n "$LANGUAGES_INPUT" ]; then
            for lang in $(echo "$LANGUAGES_INPUT" | tr ',' ' '); do
              echo "${lang}=true" >> "$GITHUB_OUTPUT"
            done
            # Set unmentioned languages to false
            for lang in python rust c_cpp cython js_ts; do
              if ! grep -q "^${lang}=" "$GITHUB_OUTPUT" 2>/dev/null; then
                echo "${lang}=false" >> "$GITHUB_OUTPUT"
              fi
            done
            exit 0
          fi

          # Python: pyproject.toml or setup.py
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          # Rust: Cargo.toml
          if [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          # C/C++: CMakeLists.txt or source files
          if [ -f CMakeLists.txt ] || \
             find . \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
               -not -path "./.pixi/*" -not -path "./.git/*" -print -quit | grep -q .; then
            echo "c_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "c_cpp=false" >> "$GITHUB_OUTPUT"
          fi

          # Cython: .pyx or .pxd files
          if find . \( -name "*.pyx" -o -name "*.pxd" \) \
               -not -path "./.pixi/*" -not -path "./.git/*" -print -quit | grep -q .; then
            echo "cython=true" >> "$GITHUB_OUTPUT"
          else
            echo "cython=false" >> "$GITHUB_OUTPUT"
          fi

          # JavaScript/TypeScript: package.json
          if [ -f package.json ]; then
            echo "js_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "js_ts=false" >> "$GITHUB_OUTPUT"
          fi

      # Shared composite action (referenced by pinned remote ref because a
      # ./-relative local action would resolve against the CALLER's checkout
      # in a reusable workflow, not this repo — issue #227). Pinned to a
      # release tag rather than @main to avoid version drift for consumers
      # pinned to an older workflow tag (issue #230); release-please keeps
      # this ref in lockstep via the x-release-please-version marker.
      - id: codeql-matrix
        uses: Claire-s-Monster/ci-framework/.github/actions/setup-codeql-matrix@v2.9.9 # x-release-please-version
        with:
          codeql-languages: ${{ inputs.codeql-languages }}
          python: ${{ steps.detect.outputs.python }}
          c_cpp: ${{ steps.detect.outputs.c_cpp }}
          js_ts: ${{ steps.detect.outputs.js_ts }}

  python-dep-audit:
    name: "🐍 Python Dependency Audit (Pixi)"
    needs: detect-languages
    if: needs.detect-languages.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Install Dependencies"
        env:
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! (pixi install -e ci || pixi install) 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Run dependency audit"
        id: audit
        run: |
          # Use the project's safety-check pixi task if available
          if pixi task list -e ci 2>/dev/null | grep -q safety-check; then
            echo "Running project safety-check task..."
            pixi run -e ci safety-check
          else
            echo "::notice::No safety-check pixi task found — skipping dependency audit"
            echo "Add a safety-check task to your pixi environment to enable auditing"
          fi
        continue-on-error: true
      - name: Fail on CVEs
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  rust-dep-audit:
    name: "🦀 Rust Dependency Audit"
    needs: detect-languages
    if: needs.detect-languages.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-audit
        id: audit
        uses: actions-rust-lang/audit@v1
        continue-on-error: true
      - name: Fail on advisories
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  rust-deny:
    name: "🦀 Rust License & Advisory Policy"
    needs: detect-languages
    if: needs.detect-languages.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  js-dep-audit:
    name: "📦 JS/TS Dependency Audit"
    needs: detect-languages
    if: needs.detect-languages.outputs.js_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm audit
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Fail on high/critical
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  sast-semgrep:
    name: "🔬 Semgrep SAST"
    needs: detect-languages
    if: needs.detect-languages.outputs.python == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        id: semgrep
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/python p/security-audit
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true
      - name: Fail on SAST findings
        if: inputs.fail-on-sast && steps.semgrep.outcome == 'failure'
        run: exit 1

  sast-codeql:
    name: "🔬 CodeQL Analysis"
    needs: detect-languages
    if: needs.detect-languages.outputs.has_codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # c-cpp uses build-mode: none so a repo with no C/C++ build system
          # (Cython-generated sources or a committed test fixture) isn't
          # hard-failed by autobuild, which would cascade into a required CI
          # failure (issue #227). Other languages keep the default build mode.
          build-mode: ${{ matrix.language == 'c-cpp' && 'none' || '' }}
      - if: matrix.language != 'c-cpp'
        uses: github/codeql-action/autobuild@v4
      # upload: true uses the native code-scanning path so the aggregate `CodeQL`
      # check reports success instead of `neutral` (issue #222). The upload is
      # performed with CI_BOT_TOKEN (a PAT with the security_events scope), so the
      # caller's GITHUB_TOKEN still does NOT need security-events: write — keeping
      # OpenSSF Scorecard Token-Permissions clean.
      - uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          upload: true
          category: codeql-${{ matrix.language }}
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}

  secret-scan:
    name: "🔑 Secret Scanning"
    needs: detect-languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          extra_args: --only-verified
        continue-on-error: true
      - name: Fail on verified secrets
        if: inputs.fail-on-secrets && steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::Verified secrets detected in repository"
          exit 1

  scorecard:
    name: "📊 OpenSSF Scorecard"
    if: inputs.scorecard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true

  security-summary:
    name: "🛡️ Security Summary"
    needs:
      - detect-languages
      - python-dep-audit
      - rust-dep-audit
      - rust-deny
      - js-dep-audit
      - sast-semgrep
      - sast-codeql
      - secret-scan
      - scorecard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Security Summary
        env:
          PYTHON_DEP_AUDIT_RESULT: ${{ needs.python-dep-audit.result }}
          RUST_DEP_AUDIT_RESULT: ${{ needs.rust-dep-audit.result }}
          RUST_DENY_RESULT: ${{ needs.rust-deny.result }}
          JS_DEP_AUDIT_RESULT: ${{ needs.js-dep-audit.result }}
          SAST_SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          SAST_CODEQL_RESULT: ${{ needs.sast-codeql.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
        run: |
          {
            echo "## 🛡️ Security Scan Results"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Python Dep Audit | $PYTHON_DEP_AUDIT_RESULT |"
            echo "| Rust Dep Audit | $RUST_DEP_AUDIT_RESULT |"
            echo "| Rust Deny | $RUST_DENY_RESULT |"
            echo "| JS/TS Dep Audit | $JS_DEP_AUDIT_RESULT |"
            echo "| Semgrep SAST | $SAST_SEMGREP_RESULT |"
            echo "| CodeQL | $SAST_CODEQL_RESULT |"
            echo "| Secret Scan | $SECRET_SCAN_RESULT |"
            echo "| OpenSSF Scorecard | $SCORECARD_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=false
          for result in \
            "$PYTHON_DEP_AUDIT_RESULT" \
            "$RUST_DEP_AUDIT_RESULT" \
            "$RUST_DENY_RESULT" \
            "$JS_DEP_AUDIT_RESULT" \
            "$SECRET_SCAN_RESULT"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::Security checks failed — see summary above"
            exit 1
          fi
