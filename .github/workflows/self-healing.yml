---
name: "🔧 Self-Healing CI"

on:
  workflow_call:
    # NOTE: this interface previously advertised `healing-level`, `auto-fix`,
    # `rollback-on-failure` inputs and a `fixes-applied` output. None of these
    # were ever implemented by actions/self-healing/action.yml or
    # framework/self_healing/engine.py (which only accepts --config,
    # --project-dir, --timeout-minutes and only writes healed/rollback/error).
    # They were dead, unimplemented surface area and have been removed rather
    # than left as silent no-ops.
    inputs:
      timeout-minutes:
        description: "Timeout for healing process"
        required: false
        default: 10
        type: number
      pixi-environment:
        description: "PIXI environment to use for healing"
        required: false
        default: 'dev'
        type: string
    outputs:
      healed:
        description: "Whether healing was successfully applied"
        value: ${{ jobs.self-healing.outputs.healed }}
      rollback-triggered:
        description: "Whether rollback was triggered"
        value: ${{ jobs.self-healing.outputs.rollback }}

jobs:
  self-healing:
    name: "🔧 Self-Healing CI"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}

    outputs:
      healed: ${{ steps.healing.outputs.healed }}
      rollback: ${{ steps.healing.outputs.rollback }}

    steps:
      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || github.token` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
        run: |
          if [ -z "${CI_BOT_TOKEN}" ]; then
            echo "CI_BOT_TOKEN not set; using the github.token fallback."
            exit 0
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "::warning title=CI_BOT_TOKEN not checked::curl is unavailable here; skipping the check."
            exit 0
          fi
          status=$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CI_BOT_TOKEN}" \
            https://api.github.com/rate_limit) || status="000"
          case "${status}" in
            200) echo "CI_BOT_TOKEN is valid." ;;
            401)
              msg="CI_BOT_TOKEN is invalid or expired (HTTP 401)."
              msg="${msg} Rotate it, or delete the secret to fall back to github.token."
              echo "::error title=CI_BOT_TOKEN invalid::${msg}"
              exit 1
              ;;
            *) echo "::warning title=CI_BOT_TOKEN unchecked::/rate_limit returned HTTP ${status}; not failing." ;;
          esac

      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}

      - name: "Run Self-Healing Engine"
        id: healing
        uses: Claire-s-Monster/ci-framework/actions/self-healing@v3.0.0  # x-release-please-version
        with:
          timeout-minutes: ${{ inputs.timeout-minutes }}
          pixi-environment: ${{ inputs.pixi-environment }}

      - name: "Setup GPG signing"
        if: steps.healing.outputs.healed == 'true'
        uses: Claire-s-Monster/ci-framework/.github/actions/gpg-signing-setup@v3.0.0  # x-release-please-version
        with:
          gpg-private-key: ${{ secrets.CI_BOT_GPG_KEY }}
          gpg-key-id: ${{ secrets.CI_BOT_GPG_KEY_ID }}
          git-user-name: "CIFrameworkBot"
          git-user-email: "223036950+CIFrameworkBot@users.noreply.github.com"
          # local, not global: this is a reusable workflow, so a consumer may
          # run it on a self-hosted runner where --global writes persist across
          # jobs and would leak this bot identity into unrelated builds.
          config-scope: local

      - name: "Commit Healing Changes"
        if: steps.healing.outputs.healed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BOT_TOKEN || github.token }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          # Commit healing changes
          git add .
          git commit -m "fix: apply self-healing fixes

          Automated fixes applied by self-healing engine.

          🤖 Generated by Self-Healing CI Framework
          Co-Authored-By: CIFrameworkBot <223036950+CIFrameworkBot@users.noreply.github.com>"

          # Push changes
          git push origin "$GIT_REF_NAME"

      - name: "Healing Summary"
        if: always()
        env:
          HEALING_HEALED: ${{ steps.healing.outputs.healed }}
          HEALING_ROLLBACK: ${{ steps.healing.outputs.rollback }}
        run: |
          {
            echo "## 🔧 Self-Healing Summary"
            echo "- **Healing Applied**: $HEALING_HEALED"
            echo "- **Rollback Triggered**: $HEALING_ROLLBACK"
          } >> "$GITHUB_STEP_SUMMARY"
