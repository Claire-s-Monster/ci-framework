---
name: "🔧 Self-Healing CI"

on:
  workflow_call:
    # NOTE: this interface previously advertised `healing-level`, `auto-fix`,
    # `rollback-on-failure` inputs and a `fixes-applied` output. None of these
    # were ever implemented by actions/self-healing/action.yml or
    # framework/self_healing/engine.py (which only accepts --config,
    # --project-dir, --timeout-minutes and only writes healed/rollback/error).
    # They were dead, unimplemented surface area and have been removed rather
    # than left as silent no-ops.
    inputs:
      timeout-minutes:
        description: "Timeout for healing process"
        required: false
        default: 10
        type: number
      pixi-environment:
        description: "PIXI environment to use for healing"
        required: false
        default: 'dev'
        type: string
    outputs:
      healed:
        description: "Whether healing was successfully applied"
        value: ${{ jobs.self-healing.outputs.healed }}
      rollback-triggered:
        description: "Whether rollback was triggered"
        value: ${{ jobs.self-healing.outputs.rollback }}

jobs:
  self-healing:
    name: "🔧 Self-Healing CI"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}

    outputs:
      healed: ${{ steps.healing.outputs.healed }}
      rollback: ${{ steps.healing.outputs.rollback }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}

      - name: "Run Self-Healing Engine"
        id: healing
        uses: ./actions/self-healing
        with:
          timeout-minutes: ${{ inputs.timeout-minutes }}
          pixi-environment: ${{ inputs.pixi-environment }}

      - name: "Commit Healing Changes"
        if: steps.healing.outputs.healed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BOT_TOKEN || github.token }}
          CI_BOT_GPG_KEY: ${{ secrets.CI_BOT_GPG_KEY }}
          CI_BOT_GPG_KEY_ID: ${{ secrets.CI_BOT_GPG_KEY_ID }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global user.name "ci-framework-bot"
          git config --global user.email "ci-framework-bot@noreply.github.com"

          # Import GPG key for signing
          if [ -n "$CI_BOT_GPG_KEY" ]; then
            echo "$CI_BOT_GPG_KEY" | gpg --import --batch
            git config --global user.signingkey "$CI_BOT_GPG_KEY_ID"
            git config --global commit.gpgSign true
          fi

          # Commit healing changes
          git add .
          git commit -m "fix: apply self-healing fixes

          Automated fixes applied by self-healing engine.

          🤖 Generated by Self-Healing CI Framework
          Co-Authored-By: ci-framework-bot <ci-framework-bot@noreply.github.com>"

          # Push changes
          git push origin "$GIT_REF_NAME"

      - name: "Healing Summary"
        if: always()
        env:
          HEALING_HEALED: ${{ steps.healing.outputs.healed }}
          HEALING_ROLLBACK: ${{ steps.healing.outputs.rollback }}
        run: |
          echo "## 🔧 Self-Healing Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Healing Applied**: $HEALING_HEALED" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Triggered**: $HEALING_ROLLBACK" >> $GITHUB_STEP_SUMMARY
