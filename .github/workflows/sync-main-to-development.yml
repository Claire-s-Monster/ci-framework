---
# ============================================================================
# SYNC MAIN → DEVELOPMENT
# ============================================================================
# After merges to main (releases, hotfixes), automatically creates and
# merges a PR to sync changes back to development. This ensures
# development always has the latest version bumps, changelogs, and
# any hotfix patches.
#
# Flow: main merge → this workflow → PR main→development → auto-merge
# ============================================================================
name: Sync Main to Development

on:
  push:
    branches:
      - main

# Top level grants no write (OpenSSF Token-Permissions, #359); writes are job-scoped.
permissions:
  contents: read

# Serialize syncs; a running sync is never cancelled, and a newer push replaces a
# queued one, which is fine because the later run sees the latest main.
concurrency:
  group: sync-main-to-development
  cancel-in-progress: false

jobs:
  sync-to-development:
    name: "🔄 Sync Main → Development"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout verify-ci-bot-token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Verify CI_BOT_TOKEN is valid
        # An expired or revoked PAT is still non-empty, so it wins
        # `CI_BOT_TOKEN || github.token` and 401s instead of falling back.
        # Fail loudly here rather than silently later (#355). No-op when unset.
        id: token-preflight
        uses: ./.github/actions/verify-ci-bot-token
        with:
          token: ${{ secrets.CI_BOT_TOKEN }}
          check-code-scanning: 'false'

      - name: Require a write-capable CI_BOT_TOKEN
        env:
          HAS_PAT: ${{ secrets.CI_BOT_TOKEN != '' }}
          USE_PAT: ${{ steps.token-preflight.outputs.use_pat }}
        run: |
          if [ "${HAS_PAT}" = "true" ] && [ "${USE_PAT}" != "true" ]; then
            echo "::error title=CI_BOT_TOKEN rejected::CI_BOT_TOKEN is set but the preflight rejected it. Falling back to github.token would stall silently, because github.token pushes do not trigger downstream workflows. Replace or fix the token."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Check if sync needed
        id: check
        run: |
          # Compare main and development — skip if identical
          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/development)
          if [ "$MAIN_SHA" = "$DEV_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Main and development are identical — no sync needed"
          # A development->main merge leaves main ahead only by the merge commit.
          # Strict up-to-date is off on main and development, so development may
          # lag by merge commits; the next content-changing push to main (e.g.
          # the release commit) syncs them all.
          elif [ "$(git rev-parse 'origin/main^{tree}')" = "$(git rev-parse 'origin/development^{tree}')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main and development have identical trees (main is ahead only by merge commits); skipping sync"
          else
            # Check if there are commits on main not in development
            AHEAD=$(git rev-list --count origin/development..origin/main)
            if [ "$AHEAD" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Development already has all main commits"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Main is $AHEAD commits ahead of development"
            fi
          fi

      - name: Create sync PR
        if: steps.check.outputs.skip != 'true'
        run: |
          # Check if a sync PR already exists
          EXISTING=$(gh pr list \
            --base development --head main \
            --state open --json number --jq '.[0].number' \
            --repo "${{ github.repository }}" || true)

          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING already exists — enabling auto-merge"
            gh pr merge "$EXISTING" \
              --auto --merge --repo "${{ github.repository }}" || true
          else
            # Create new PR and enable auto-merge
            PR_URL=$(gh pr create \
              --base development --head main \
              --title "chore: sync main back to development" \
              --body "$(cat <<'EOF'
          ## Automated Sync

          Syncs release changes (version bumps, changelog, hotfixes) from `main` back to `development`.

          This PR is auto-created and auto-merged after CI passes.

          🤖 Automated by [sync-main-to-development](../.github/workflows/sync-main-to-development.yml)
          EOF
              )" \
              --repo "${{ github.repository }}")

            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created sync PR #$PR_NUMBER"

            gh pr merge "$PR_NUMBER" \
              --auto --merge --repo "${{ github.repository }}" || true
          fi
        env:
          # CI_BOT_TOKEN (PAT) required so the merge push triggers
          # downstream on:push workflows. GITHUB_TOKEN pushes are
          # silently ignored by Actions. The PAT is used only when the
          # preflight accepted it (#509); otherwise github.token.
          GH_TOKEN: ${{ steps.token-preflight.outputs.use_pat == 'true' && secrets.CI_BOT_TOKEN || github.token }}
