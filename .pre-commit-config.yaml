repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # This file is a Jinja2 scaffolding template (uses {{ }} / {% %}
        # control tags), not standalone YAML — it is only valid after a
        # templating engine renders it. check-yaml would otherwise reject it
        # on every run for content it was never meant to parse as-is.
        exclude: ^templates/github/dependabot\.yml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix']
      - id: mixed-line-ending
        args: ['--fix=lf']

  # This repo previously pinned the astral-sh/ruff-pre-commit `rev:` by hand
  # to match whatever ruff pixi resolves in the `quality` env, with a comment
  # instructing a human to bump it whenever that changed. That's the same
  # manual-sync shape as #250's pixi-version vs. the setup-pixi action tag —
  # one side moves automatically (pixi.lock), the other only when somebody
  # notices (this rev:). When they diverged, this hook's ruff-format and
  # `pixi run -e quality format-check` undid each other's fixes. A `repo:
  # local` hook invoking the pixi-installed ruff removes the second pin
  # entirely: there is one ruff binary, so the two gates cannot disagree.
  #
  # The consumer-facing template (templates/pre-commit-config.yaml)
  # deliberately keep the pinned external repo instead of this local hook —
  # pre-commit.ci has no pixi on PATH, so a repo:local hook would break
  # hosted runs for generated projects. That divergence is intentional.
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint (pixi quality env)
        entry: pixi run -e quality ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format (pixi quality env)
        entry: pixi run -e quality ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
