---
name: "Self-Healing CI Action"
description: "Analyzes CI failures, applies automated fixes, and safely rolls back if needed."

inputs:
  config:
    description: "Path to self-healing configuration file"
    required: false
    default: ""
  project-dir:
    description: "Project directory to operate in"
    required: false
    default: "."
  timeout-minutes:
    description: "Timeout for the healing process (minutes)"
    required: false
    default: "10"
  pixi-environment:
    description: "PIXI environment to use for self-healing"
    required: false
    default: "dev"

  pixi-version:
    description: "Pixi CLI version for setup-pixi (binary version, not the action tag). Must support the consumer lockfile schema: pixi >= v0.68.0 is required for pixi.lock schema v7."
    required: false
    default: "v0.74.0"

outputs:
  healed:
    description: "Whether a fix was successfully applied"
  rollback:
    description: "Whether a rollback was triggered"
  error:
    description: "Error message if healing failed"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install PIXI
      uses: prefix-dev/setup-pixi@v0.8.13
      with:
        pixi-version: ${{ inputs.pixi-version }}
        cache: false

    - name: Install dependencies
      run: |
        pixi install -e "${{ inputs.pixi-environment }}"
      shell: bash

    - name: Run Self-Healing Engine
      run: |
        pixi run -e "${{ inputs.pixi-environment }}" python -m framework.self_healing.engine \
          --config "${{ inputs.config }}" \
          --project-dir "${{ inputs.project-dir }}" \
          --timeout-minutes "${{ inputs.timeout-minutes }}"
      shell: bash

    - name: Set outputs
      id: set-outputs
      run: |
        {
          echo "healed=$(grep healed .self_healing_status | cut -d'=' -f2)"
          echo "rollback=$(grep rollback .self_healing_status | cut -d'=' -f2)"
          echo "error=$(grep error .self_healing_status | cut -d'=' -f2-)"
        } >> "$GITHUB_OUTPUT"
      shell: bash
      if: always()
