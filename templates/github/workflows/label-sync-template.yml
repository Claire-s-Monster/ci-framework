# Label Sync Template - CI Framework
# Creates the labels that Dependabot and the pixi lock refresh request, so they
# are applied instead of silently dropped. Runs on demand and whenever
# .github/dependabot.yml (or this file) changes on the default branch.
# Until the first release containing reusable-label-sync.yml, replace the ref
# below with @development. See docs/label-sync.md.

name: Label Sync

on:
  workflow_dispatch:
  push:
    branches: [main]  # change to your default branch
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/label-sync.yml'

# Top level grants nothing (OpenSSF Token-Permissions); the job scopes writes.
permissions: {}

jobs:
  labels:
    permissions:
      issues: write  # gh label create --force
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-label-sync.yml@v4.2.1 # x-release-please-version
    # with:
    #   labels: |     # newline-separated name|color|description; default set below
    #     dependencies|0366d6|Pull requests that update a dependency file
    #     python|3572A5|Pull requests that update Python code
    #     github-actions|000000|Pull requests that update GitHub Actions code
    #     docker|0db7ed|Pull requests that update Docker code
    #     nodejs|539e43|Pull requests that update Node.js code
    #     pixi|fdd835|Pull requests that update pixi dependencies
