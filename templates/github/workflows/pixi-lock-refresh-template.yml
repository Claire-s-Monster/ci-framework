# Pixi Lock Refresh Template - CI Framework
# Refreshes pixi.lock weekly and opens (or updates) a signed bot PR. The default
# shape below needs zero secrets; an optional GitHub App shape is described next
# to the permissions. Default-shape prerequisites (two, one-time per repo):
#   1. your CI workflow (ci.yml) declares `workflow_dispatch:` under `on:`;
#   2. Settings > Actions > General > "Allow GitHub Actions to create and
#      approve pull requests" is enabled.
# Until the first release containing reusable-pixi-lock-refresh.yml, replace the
# ref below with @development. See docs/pixi-lock-refresh.md.

name: Pixi Lock Refresh

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Top level grants nothing (OpenSSF Token-Permissions); the job scopes writes.
permissions: {}

jobs:
  refresh:
    # Default shape: zero secrets, github.token. Scorecard flags the
    # contents/actions writes; see docs/pixi-lock-refresh.md "Scorecard
    # Token-Permissions alerts". To clear them, use the GitHub App shape below.
    permissions:
      contents: write        # API-signed commit
      pull-requests: write   # open the PR and enable auto-merge
      actions: write         # dispatch CI on the refresh branch (github.token PRs don't trigger workflows)
    # Alternative shape: a GitHub App token does the commit, PR and auto-merge, so
    # the caller needs only `contents: read`, and App-authored pushes and PRs
    # trigger CI natively (no workflow_dispatch needed in your CI). The App needs
    # Contents: write and Pull requests: write and must be installed on this
    # repository. To use it, replace the permissions block above with:
    # permissions:
    #   contents: read
    # and add this next to `uses:` below:
    # secrets:
    #   APP_CLIENT_ID: ${{ secrets.LOCK_REFRESH_APP_CLIENT_ID }}
    #   APP_PRIVATE_KEY: ${{ secrets.LOCK_REFRESH_APP_PRIVATE_KEY }}
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-pixi-lock-refresh.yml@v4.2.1  # x-release-please-version
    with:
      target-branch: development
      environments: ''          # space-separated; empty updates all
      auto-merge: false
      labels: 'dependencies,pixi'  # comma-separated; '' = none; see label-sync-template.yml
    # Less commonly tuned inputs (shown with their defaults):
    #   branch-name: chore/pixi-lock-refresh   # bot-owned, force-pushed
    #   pixi-version: v0.82.0
    #   package-path: .
    #   conda-first-check: enforce
    #   conda-first-allow: 'hb-*'
    #   ci-workflow: ci.yml     # dispatched on branch-name; '' disables
